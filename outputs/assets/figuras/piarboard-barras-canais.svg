<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120" fill="none" font-family="JetBrains Mono, monospace">
  <title>Barras de canais do PiaRBoard</title>
  <desc>Na landing page este grafico e desenhado em CSS puro. Este arquivo e o equivalente em SVG, com valores de demonstracao.</desc>
  <defs>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9BC1F"/>
      <stop offset="100%" stop-color="#FED136"/>
    </linearGradient>
  </defs>
  <g font-size="8" letter-spacing="1" fill="#FFFFFF" fill-opacity=".45" text-transform="uppercase">
    <text x="0" y="14">IMPRENSA</text>
    <text x="0" y="44">BUSCA</text>
    <text x="0" y="74">RESPOSTAS DE IA</text>
    <text x="0" y="104">SOCIAL</text>
  </g>
  <g>
    <rect x="96" y="7"  width="190" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="96" y="7"  width="167" height="7" rx="3.5" fill="url(#barFill)"/>
    <rect x="96" y="37" width="190" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="96" y="37" width="135" height="7" rx="3.5" fill="url(#barFill)"/>
    <rect x="96" y="67" width="190" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="96" y="67" width="103" height="7" rx="3.5" fill="url(#barFill)"/>
    <rect x="96" y="97" width="190" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="96" y="97" width="74"  height="7" rx="3.5" fill="url(#barFill)"/>
  </g>
  <g font-size="8" fill="#FFFFFF" fill-opacity=".75" text-anchor="end">
    <text x="320" y="14">88</text>
    <text x="320" y="44">71</text>
    <text x="320" y="74">54</text>
    <text x="320" y="104">39</text>
