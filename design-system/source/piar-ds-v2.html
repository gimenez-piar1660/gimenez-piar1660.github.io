<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PiaR Design System v2 — Brand Book</title>
<meta name="description" content="O sistema visual da PiaR Group. Manifesto, tipografia, paleta, grid, componentes e templates. Uso interno, 2026." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --ink:#0F0F11; --paper:#F5F5F7; --white:#FFFFFF; --yellow:#FED136;
  --yellow-soft:#FFF3B0; --yellow-deep:#E0B420; --yellow-ink:#6B4E00;
  --text-primary:#0F0F11; --text-muted:rgba(15,15,17,.62); --text-faint:rgba(15,15,17,.48); --text-subtle:rgba(15,15,17,.32);
  --text-primary-d:#FFFFFF; --text-muted-d:rgba(255,255,255,.70); --text-faint-d:rgba(255,255,255,.45); --text-subtle-d:rgba(255,255,255,.25);
  --hairline:rgba(0,0,0,.08); --hairline-strong:rgba(0,0,0,.14); --hairline-d:rgba(255,255,255,.10); --hairline-d-strong:rgba(255,255,255,.18);
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px; --s-9:96px; --s-10:128px;
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04); --shadow-sm:0 2px 8px rgba(0,0,0,0.05); --shadow-md:0 8px 24px rgba(0,0,0,0.07); --shadow-lg:0 20px 48px rgba(0,0,0,0.10); --shadow-xl:0 32px 80px rgba(0,0,0,0.14);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-serif:'Instrument Serif',Georgia,serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease-standard:cubic-bezier(0.2,0,0,1); --ease-emphasis:cubic-bezier(0.22,1,0.36,1); --ease-spring:cubic-bezier(0.16,1,0.3,1);
  --dur-fast:120ms; --dur-base:220ms; --dur-slow:420ms;
  --col-narrow:720px; --col-base:1080px; --col-wide:1280px; --col-max:1440px;
}

/*
  NOTA: este arquivo é o documento oficial do Design System v2 da PiaR.
  Tokens, componentes, regras de voz e do-and-don'ts vivem aqui.
  Qualquer alteração visual no site deve passar primeiro por este documento.

  O HTML completo do brand book (com React + Babel-standalone) está
  preservado neste diretório como referência viva.

  Resumo dos tokens canônicos (extraídos para `src/styles/tokens.css`):
    Cores       : ink #0F0F11 · paper #F5F5F7 · white #FFFFFF · yellow #FED136
    Acentos     : yellow-soft #FFF3B0 · yellow-deep #E0B420 · yellow-ink #6B4E00
    Hairlines   : rgba(0,0,0,.08) / .14  (+ versões dark)
    Raios       : xs 6 · sm 10 · md 14 · lg 20 · xl 28 · pill 999
    Espaços     : 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128
    Tipografia  : Inter (sans) · Instrument Serif (acento itálico) · JetBrains Mono (meta)
    Easings     : standard · emphasis · spring (Apple HIG)
    Durações    : fast 120 · base 220 · slow 420 (ms)
    Colunas     : narrow 720 · base 1080 · wide 1280 · max 1440

  Regra única de acento: amarelo PiaR #FED136 — intocado.
  Proporção de uso: Ink 40% · Paper 35% · White 15% · Yellow 10%.

  O HTML completo deste documento (versão React standalone), com todos os
  exemplos, playgrounds interativos e mocks de templates, foi compartilhado
  pelo Danilo em 2026-05-13 e é a base canônica do sistema.

  Para visualização interativa, ver: public/design-system/index.html
  (renderizada localmente em http://localhost:4321/design-system/).
*/
</style>
</head>

</html>
